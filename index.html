<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070e">
<title>System Arise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: phone-first card stack on warm charcoal; huge condensed numerals for days/levels, wide grotesk for titles, mono labels; fixed 5-tab bar. Dark-only by design. */
:root{
  --bg:#04070e; --bg2:#08101e; --card:#0b1426; --card2:#0f1a31; --line:#1a2a47; --line2:#27406a;
  --orange:#2EA8FF; --orange2:#6CC6FF; --orange-dim:rgba(46,168,255,.14); --glow:rgba(46,168,255,.55);
  --cream:#E6F2FF; --fg2:#8FA6C6; --fg3:#506583;
  --green:#4ADE80; --red:#E8664F; --violet:#8B7CF6; --teal:#3CC6B5; --gold:#F4C152;
  --anton:"Anton","Bebas Neue","Impact","Arial Narrow",sans-serif;
  --wide:"Unbounded","Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Archivo","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg);color:var(--cream)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(80% 30% at 100% 100%,rgba(46,168,255,.10),transparent 70%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* ---------- type ---------- */
.label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fg2)}
.label.o{color:var(--orange)}
.title{font-family:var(--wide);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.anton{font-family:var(--anton);font-weight:400;letter-spacing:.01em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}
.small{font-size:13px}
.note{font-size:12px;color:var(--fg3)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2>*,.grid3>*{min-width:0}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.card.flat{background:transparent}
.tile{border:1.5px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg2)}
.tile .label{font-size:10px}
.tile .v{font-family:var(--wide);font-weight:700;font-size:19px;margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}

/* chips & boxy buttons with offset shadow */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg2);font-family:var(--wide);font-weight:700;font-size:13px}
.chip svg{width:15px;height:15px}
.chip.hot{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}
.box-btn{border:1.5px solid var(--line2);background:var(--bg2);border-radius:4px;box-shadow:3px 3px 0 #000;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 12px;font-family:var(--body);font-weight:600}
.box-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.box-btn:disabled{opacity:.35;cursor:default}
.box-btn.on{background:var(--cream);color:#03101f;border-color:var(--cream)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;border:0;border-radius:12px;background:var(--orange);color:#01101f;font-family:var(--wide);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 6px 24px rgba(46,168,255,.25)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line2);box-shadow:none}
.btn.done{background:var(--card2);color:var(--green);border:1.5px solid rgba(74,222,128,.4);box-shadow:none}
.btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red);box-shadow:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 14px;border:1.5px solid var(--line2);border-radius:4px;background:transparent;font-family:var(--body);font-weight:600;font-size:14px;box-shadow:3px 3px 0 #000}
.seg button[aria-pressed="true"]{background:var(--cream);color:#03101f;border-color:var(--cream)}
.seg button .c{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.7}
.input{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
.input:focus{border-color:var(--orange);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);min-width:0}
label.f .input{font-family:var(--body);font-size:15px;letter-spacing:0;text-transform:none;color:var(--cream)}

/* bars */
.bar{height:8px;background:#03060c;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.green>i{background:var(--green)}
.segbar{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;padding:6px;background:#03060c;border:1px solid var(--line);border-radius:4px}
.segbar i{height:12px;background:#132038;border-radius:1px}
.segbar i.on{background:var(--orange)}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .sp{flex:1}
.savestate{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--fg3);margin-top:-6px}
.savestate.ok{color:#4f8fbf}

/* day hero */
.dayhero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dayhero .d{font-family:var(--anton);font-size:64px;line-height:.9;letter-spacing:.005em}
.dayhero .d small{font-family:var(--wide);font-size:20px;color:var(--fg3);font-weight:600;margin-left:6px}
.msg{font-family:var(--body);font-weight:600;font-size:16px;color:var(--fg2);margin:2px 0 0}

/* level strip */
.lvlstrip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.lvlbox{background:var(--orange);color:#01101f;border-radius:8px;padding:6px 12px 8px;text-align:left;min-width:74px;clip-path:polygon(0 0,100% 0,100% 78%,82% 100%,0 100%)}
.lvlbox b{display:block;font-family:var(--wide);font-weight:800;font-size:30px;line-height:1}
.lvlbox span{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.2em}

/* ---------- quest cards ---------- */
.qcard{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;width:100%;text-align:left;min-height:118px;padding:14px 14px 14px 16px;
  background:linear-gradient(135deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s,opacity .2s}
.qcard .kanji{position:absolute;right:58px;top:-14px;font-family:var(--jp);font-weight:900;font-size:120px;line-height:1;color:rgba(190,225,255,.045);pointer-events:none;user-select:none}
.qcard .streak{position:absolute;top:12px;left:16px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1.5px solid var(--orange);border-radius:4px;color:var(--orange);font-family:var(--wide);font-weight:700;font-size:11px;background:rgba(3,7,15,.6)}
.qcard .streak svg{width:11px;height:11px}
.qcard .qt{font-family:var(--wide);font-weight:700;font-size:21px;line-height:1.1;margin-top:34px;min-width:0}
.qcard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;font-weight:600;color:var(--fg2)}
.qcard .meta span+span::before{content:"|";margin-right:10px;color:var(--line2)}
.qcheck{width:46px;height:46px;border:1.5px solid var(--line2);border-radius:4px;background:#132038;box-shadow:3px 3px 0 #000;display:grid;place-items:center;color:var(--fg3)}
.qcard.done{opacity:.72}
.qcard.done .qcheck{background:var(--orange);border-color:var(--orange);color:#01101f}
.qcard.done .qt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--orange)}
.qcard:active{transform:scale(.99)}
.habit{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;text-align:left;font-weight:600}
.habit .hb{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:3px;display:grid;place-items:center;flex:none}
.habit.done .hb{background:var(--orange);border-color:var(--orange);color:#01101f}
.habit.done span{color:var(--fg3);text-decoration:line-through}
.warnline{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;font-size:13px;color:var(--fg2)}
.warnline b{color:var(--orange);font-family:var(--mono);letter-spacing:.08em}
.warnline.ok b{color:var(--green)}

/* ---------- gym ---------- */
.session{padding:0;border-radius:16px}
.session .hero{position:relative;height:170px;padding:14px;background:
  radial-gradient(120% 90% at 85% 10%,rgba(46,168,255,.28),transparent 55%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px),#060c18;border-bottom:2px solid var(--orange);overflow:hidden}
.session .hero .kanji{position:absolute;right:-6px;bottom:-24px;font-family:var(--jp);font-weight:900;font-size:170px;line-height:1;color:rgba(46,168,255,.16)}
.session .hero .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--cream);color:#03101f;font-family:var(--wide);font-weight:700;font-size:11px}
.session .hero .tag i{width:7px;height:7px;background:var(--orange);display:block}
.session .hero .tag2{position:absolute;right:14px;top:14px;padding:5px 10px;background:rgba(190,225,255,.9);color:#03101f;font-family:var(--wide);font-weight:700;font-size:10px;letter-spacing:.06em}
.session .hero h2{position:absolute;left:14px;bottom:12px;right:14px;margin:0;font-family:var(--wide);font-weight:800;font-size:30px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.session .body{padding:14px;display:flex;flex-direction:column;gap:12px}
.why{font-size:13px;color:var(--fg2);border-left:3px solid var(--orange);padding:2px 0 2px 10px}
.why.warn{border-color:var(--red);color:#ffb4a8}
.exchips{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1.5px dashed var(--line2)}
.exchips span{border:1.5px solid var(--line2);border-radius:3px;padding:5px 9px;font-size:13px;font-weight:600}
.exchips span b{color:var(--orange);margin-right:4px;font-family:var(--wide)}
.timer{font-family:var(--anton);font-size:34px;letter-spacing:.02em;color:var(--orange)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week>div{border:1.5px solid var(--line);border-radius:6px;padding:6px 2px;text-align:center;background:var(--bg2);min-width:0}
.week>div .wd{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--fg3)}
.week>div .ss{word-break:normal!important;font-family:var(--wide);font-weight:700;font-size:10px;line-height:1.15;margin-top:3px;word-break:break-word}
.week>div.today{border-color:var(--orange);background:var(--orange-dim)}
.week>div.done .ss{color:var(--green)}
.week>div.rest .ss{color:var(--fg3)}
.week>div.plan{border-style:dashed}

.muscles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mus{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg2)}
.mus .between b{font-family:var(--wide);font-size:12px;font-weight:700;letter-spacing:.02em}
.mus .st{font-family:var(--mono);font-size:9px;letter-spacing:.1em}
.mus .bar{height:5px;margin-top:6px}
.mus.rec .st{color:var(--orange)} .mus.ok .st{color:var(--green)} .mus.now .st{color:var(--red)}
.mus.rec .bar>i{background:var(--orange)} .mus.ok .bar>i{background:var(--green)} .mus.now .bar>i{background:var(--red)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1.5px solid var(--line2);border-radius:10px;background:transparent;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12px;line-height:1.15;min-width:0}
.quick button .sq{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;color:#03101f;font-family:var(--jp);font-weight:900;font-size:15px}
.quick button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-dim)}
.quick button.tired{opacity:.55}

.ex{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 12px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.ex.pr{border-color:rgba(74,222,128,.55)}
.ex.full{border-color:rgba(46,168,255,.5)}
.thumb{width:64px;height:64px;border-radius:8px;border:1.5px dashed var(--line2);background:var(--bg2) center/cover no-repeat;display:grid;place-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--fg3);text-align:center;line-height:1.3;position:relative}
.thumb.has{border-style:solid;border-color:var(--line)}
.thumb .n{position:absolute;right:3px;bottom:3px;background:rgba(3,7,15,.85);color:var(--cream);font-size:9px;padding:1px 4px;border-radius:3px}
.ex-name{font-family:var(--wide);font-weight:700;font-size:15px;line-height:1.15;background:none;border:0;padding:0;text-align:left}
.ex-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--fg2);margin-top:3px}
.ex-meta b{color:var(--cream);font-family:var(--mono);font-weight:500}
.ex-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.kg{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:6px;background:var(--bg2)}
.kg button{background:none;border:0;width:30px;height:34px;color:var(--fg2);font-size:18px}
.kg input{width:48px;text-align:center;background:none;border:0;font-family:var(--mono);font-size:14px;padding:0}
.kg span{font-family:var(--mono);font-size:10px;color:var(--fg3);padding-right:6px}
.sets{display:flex;gap:5px;flex-wrap:wrap}
.sets button{width:30px;height:30px;border:1.5px solid var(--line2);border-radius:3px;background:var(--bg2);font-family:var(--mono);font-size:12px;color:var(--fg3);box-shadow:2px 2px 0 #000}
.sets button.on{background:var(--orange);border-color:var(--orange);color:#01101f}
.prtag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;background:var(--green);color:#06210f;padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:2px}

.recent{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.recent b{font-family:var(--wide);font-size:15px}
.recent .vol{border:1.5px solid var(--line2);padding:5px 9px;border-radius:3px;font-family:var(--wide);font-weight:700;font-size:13px;white-space:nowrap}
.cond{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.cond:last-child{border-bottom:0}
.cond .ok{color:var(--green)}
table.ov{width:100%;border-collapse:collapse;font-size:13px}
table.ov th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--fg3);text-align:left;font-weight:500;padding:0 6px 8px 0}
table.ov td{padding:8px 6px 8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.ov td.up{color:var(--green);font-family:var(--mono)} table.ov td.flat{color:var(--fg3);font-family:var(--mono)}
.scroll-x{overflow-x:auto}

/* ---------- rating ---------- */
.rate-head{display:grid;grid-template-columns:auto 1fr;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.rate-head .lv{background:var(--orange);color:#01101f;padding:14px 18px 16px;clip-path:polygon(0 0,100% 0,100% 80%,86% 100%,0 100%)}
.rate-head .lv b{display:block;font-family:var(--wide);font-weight:800;font-size:46px;line-height:1}
.rate-head .lv span{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em}
.rate-head .xp{padding:14px;text-align:right;align-self:center}
.rate-head .xp b{font-family:var(--wide);font-weight:800;font-size:28px;display:block;line-height:1}
.statrow{display:grid;grid-template-columns:22px 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.statrow .ic{width:18px;height:18px}
.statrow .nm{font-family:var(--wide);font-weight:600;font-size:13px;letter-spacing:.16em;color:var(--fg2)}
.statrow .dl{font-family:var(--mono);font-size:12px;color:var(--green)}
.statrow .dl.z{color:var(--fg3)}
.statrow .val{font-family:var(--wide);font-weight:800;font-size:38px;line-height:1;min-width:2.2ch;text-align:right}
.classcard{padding:0}
.classcard .top{padding:16px;background:radial-gradient(100% 120% at 100% 0,rgba(46,168,255,.22),transparent 60%),#060c18;position:relative;overflow:hidden}
.classcard .top .kanji{position:absolute;right:-4px;top:-16px;font-family:var(--jp);font-weight:900;font-size:150px;line-height:1;color:rgba(190,225,255,.06)}
.classcard .cls{font-family:var(--wide);font-weight:800;font-size:38px;line-height:1;margin:6px 0 4px;letter-spacing:-.01em}
.classtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}
.classtiles div{border:1.5px solid var(--line);border-radius:8px;padding:8px;background:rgba(3,7,15,.6)}
.classtiles div.top1{border-color:var(--orange)}
.classtiles b{display:block;font-family:var(--wide);font-weight:800;font-size:20px}
.classtiles span{font-family:var(--mono);font-size:8.5px;word-break:break-all;letter-spacing:.1em;color:var(--fg2)}
.achgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center;max-width:100%}
.ach .g{font-family:var(--wide);font-size:26px;color:#1a2a47;line-height:1}
.ach .t{font-size:9px;font-family:var(--mono);color:var(--fg3);line-height:1.2;letter-spacing:.02em}
.ach.on{background:radial-gradient(circle at 50% 30%,rgba(46,168,255,.28),transparent 70%),var(--card2);border-color:var(--orange)}
.ach.on .g{font-family:var(--jp);font-weight:900;color:var(--orange);font-size:28px}
.ach.on .t{color:var(--cream)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--fg3);text-align:center}
.badge .gem{width:40px;height:40px;transform:rotate(45deg);border:1.5px solid var(--line);background:var(--bg2);display:grid;place-items:center}
.badge .gem span{transform:rotate(-45deg);font-family:var(--wide);font-weight:800;font-size:12px;color:var(--line2)}
.badge.on{color:var(--fg2)}
.badge.on .gem{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#060c18)}
.badge.on .gem span{color:var(--c)}
.chart{width:100%;height:auto;display:block}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.phases div{font-family:var(--mono);font-size:9px;color:var(--fg3);border-top:3px solid var(--line);padding-top:5px}
.phases div.on{color:var(--cream);border-color:var(--orange)}

function compute(asOf=TODAY){
  const keys=Object.keys(S.days).filter(k=>k>=S.startDate&&k<=asOf).sort();
  let earned=0,full=0,ok=0; const c={workout:0,protein:0,water:0,sleep:0,learning:0,planning:0,business:0};
  keys.forEach(k=>{const d=S.days[k]; earned+=QXP(k); QUESTS.forEach(q=>{if(d.q[q.id])c[q.id]++}); if(QN(k)===QUESTS.length)full++; if(QXP(k)>=STREAK_MIN)ok++});
  let pen=0; const span=Math.max(0,diffDays(S.startDate,asOf));
  for(let i=0;i<span;i++) pen+=penaltyOn(addDays(S.startDate,i));
  const total=Math.max(0,earned-pen);
  let best=0,run=0; for(let i=0;i<=span;i++){const k=addDays(S.startDate,i); if(QXP(k)>=STREAK_MIN){run++;best=Math.max(best,run)} else run=0}
  let cur=0,k=asOf; if(QXP(k)<STREAK_MIN) k=addDays(k,-1); while(k>=S.startDate&&QXP(k)>=STREAK_MIN){cur++;k=addDays(k,-1)}
  const t=parseKey(asOf), mon=addDays(asOf,-((t.getDay()+6)%7)); let wk=0; for(let i=0;i<7;i++){const kk=addDays(mon,i); if(kk<=asOf&&QXP(kk)>=STREAK_MIN)wk++}
  let mo=0; keys.forEach(kk=>{if(kk.slice(0,7)===asOf.slice(0,7)&&QXP(kk)>=STREAK_MIN)mo++});
  let prs=0; const h=liftHistory(); for(const ex in h){let b=0; h[ex].forEach((x,i)=>{if(x.k<=asOf){if(i>0&&x.kg>b)prs++; b=Math.max(b,x.kg)}})}
  const lv=levelFrom(total);
  const stats={STRENGTH:10+c.workout+prs*2,DISCIPLINE:10+c.planning+full*2,HEALTH:10+Math.round((c.protein+c.water+c.sleep)/2),CONSISTENCY:10+ok,KNOWLEDGE:10+Math.round(c.learning*1.5),BUSINESS:10+Math.round(c.business*1.5)};
  const w=weightAt(asOf), gain=+(w-S.startWeight).toFixed(1);
  const bench=bestEver('Bench Press',asOf), squat=bestEver('Squat',asOf), dead=bestEver('Leg Press',asOf);
  const quests=Object.values(c).reduce((a,b)=>a+b,0), logged=weightLog().filter(x=>x.k<=asOf).length;
  return {total,earned,pen,lv,c,full,ok,best,cur,wk,mo,prs,stats,w,gain,bench,squat,dead,coins:(lv.L-1)*100,quests,logged};
}

/* final list of exercises for a date: sets/reps adjusted by ramp + stage, trimmed to the time budget */
function buildWorkout(k){

  const n=dayNum(k), ramp=rampOf(n), st=stageOf(weightAt(k)), stg=STAGE[st], S_=SESSIONS[name];
  let list=S_.ex.map(([ex,sets,reps])=>{
    const major=MAJORS.includes(ex), bw=isBW(ex); let s=sets, r=reps;
    if(!bw){ if(major) r=stg.reps;
      if(n>28){ if(st>=2&&major) s=sets+1; if(st>=3){ s=major?Math.min(6,Math.max(5,sets+1)):4 } } }

      if(/s$/.test(reps)) r=Math.min(parseInt(reps)+done*5,parseInt(reps)+60)+'s'; else r=String(Math.min(parseInt(reps)+Math.floor(done/2),parseInt(reps)+10))}
    return {ex,sets:s,reps:r,major,bw};
  });
  const perSet=40+stg.rest, budget=workBudget()*60; let est=list.reduce((a,e)=>a+e.sets*perSet,0), trimmed=false;

}

function autoLoad(ex,k,sets){
  if(isBW(ex)) return null;
  const [ratio,ul,db]=LOAD[ex], step=stepOf(ex), bw=weightAt(k), b=bmi(bw), safe=b&&b<18.5?.9:1, n=dayNum(k), ramp=rampOf(n), st=stageOf(bw);

  const hist=(liftHistory()[ex]||[]).filter(x=>x.k<k), last=hist[hist.length-1], prev=hist[hist.length-2];
  const full=x=>x&&x.sets>=(x.plan||sets)&&x.feel!=='form'&&x.feel!=='hard';
  const inc=kg=>+(kg+(st>=2?Math.max(step,roundTo(kg*.05,step)):step)).toFixed(1);
  let kg=base, why=`Start load from ${bw.toFixed(1)} kg bodyweight${ramp.load<1?' (easy start)':''}`;

    else if(!full(last)){why=`Complete all ${sets} sets at ${last.kg} kg to unlock the next jump`}
    else if(last.feel==='easy'){kg=inc(last.kg); why=`Felt easy last time → +${(kg-last.kg).toFixed(1)} kg`}

const queue=[]; let busy=false;

function checkEvents(prev){
  const D=compute(), L=D.lv.L, R=rankOf(L)[1]; let ch=false; const fresh=[];
  ACH.forEach(a=>{if(a[3](D)&&!S.ach[a[0]]){S.ach[a[0]]=TODAY;fresh.push(a)}}); if(fresh.length)ch=true;
  if(L>S.seenLevel){const gains=[]; if(prev) for(const s in D.stats){const d=D.stats[s]-prev[s]; if(d>0)gains.push(`+${d} ${s[0]+s.slice(1).toLowerCase()}`)}
    const from=S.seenLevel; S.seenLevel=L; ch=true; queue.push(()=>showLevel(from,L,gains))}
  else if(L<S.seenLevel){S.seenLevel=L;ch=true}

}

function routineView(k){
  const d=day(k), R=sortedRoutine(), now=nowHM(), isToday=k===TODAY;

  return `<section class="card routine">

function repItem(key,label,reps,on,full=1){return `<button class="titem ${on?'done':''}" data-chk="${key}" data-full="${full}" style="width:100%;text-align:left"><div><b>${label}</b><div class="note">${reps}</div></div><span class="tick">${on?I.check.replace(/22/g,'16'):''}</span></button>`}
function phaseList(kind,items,g){
  const st=g[kind]||{}, dur=(v,x)=>(v>=60&&v%60===0?v/60+' min':v+' s')+(x>1?' × '+x:'');
  return items.map(([n,v,x,nt],i)=>{const key=kind+':'+i; return typeof v==='number'?(SIMPLE()?repItem(key,n,nt||dur(v,x||1),(st[i]||0)>=(x||1),x||1):timedItem(key,n,v,x||1,st[i]||0,nt)):repItem(key,n,v,!!st[i])}).join('');
}

function compress(file,cb,max=720,q=.78){const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*r),h=Math.round(img.height*r),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(url);cb(null)}; img.src=url}

function weightChart(){
  const L=weightLog(); if(!L.length) return '<div class="note">No weight entries yet. Log your first one above.</div>';
  const W=340,H=170,pl=34,pr=10,pt=12,pb=24, xs=L.map(x=>diffDays(S.startDate,x.k)), minX=Math.min(0,...xs), maxX=Math.max(minX+7,...xs);
  const lo=Math.floor(Math.min(S.startWeight,...L.map(x=>x.w))-1), hi=Math.ceil(Math.max(S.targetWeight,...L.map(x=>x.w)));
  const X=v=>pl+(v-minX)/(maxX-minX)*(W-pl-pr), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb), step=hi-lo>10?4:2; let grid='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#132038"/><text x="${pl-6}" y="${Y(v)+3}" fill="#506583" font-size="9" text-anchor="end" font-family="JetBrains Mono,monospace">${v}</text>`;
  const pts=L.map(x=>`${X(diffDays(S.startDate,x.k)).toFixed(1)},${Y(x.w).toFixed(1)}`), last=L[L.length-1];
  const area=`M${pts[0]} L${pts.join(' L')} L${X(diffDays(S.startDate,last.k)).toFixed(1)},${H-pb} L${X(diffDays(S.startDate,L[0].k)).toFixed(1)},${H-pb} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time"><defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2EA8FF" stop-opacity=".35"/><stop offset="1" stop-color="#2EA8FF" stop-opacity="0"/></linearGradient></defs>${grid}
   <line x1="${pl}" x2="${W-pr}" y1="${Y(S.targetWeight)}" y2="${Y(S.targetWeight)}" stroke="#4ADE80" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(S.targetWeight)-4}" fill="#4ADE80" font-size="9" text-anchor="end" font-family="JetBrains Mono,monospace">TARGET ${S.targetWeight}</text>
   ${L.length>1?`<path d="${area}" fill="url(#wa)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#2EA8FF" stroke-width="2.2"/>`:''}
   <circle cx="${X(diffDays(S.startDate,last.k))}" cy="${Y(last.w)}" r="4.5" fill="#2EA8FF" stroke="#04070e" stroke-width="2"/>
   <text x="${pl}" y="${H-6}" fill="#506583" font-size="9" font-family="JetBrains Mono,monospace">D${minX+1}</text><text x="${W-pr}" y="${H-6}" fill="#506583" font-size="9" text-anchor="end" font-family="JetBrains Mono,monospace">D${maxX+1}</text></svg>`;
}

/* =========================================================
   CLOUD — Firebase realtime sync
   ========================================================= */
const CLOUD=(()=>{
  const SDK='https://www.gstatic.com/firebasejs/10.12.2/';
  const SECTIONS=[['progress','Quests, XP, routine, achievements'],['gym','Gym logs & workouts'],['body','Weight & measurements'],['settings','Profile & settings'],['images','My images'],['defaults','System images from backend']];
  const DEV=(()=>{try{let d=localStorage.getItem(LS+'-dev'); if(!d){d=Math.random().toString(36).slice(2,10); localStorage.setItem(LS+'-dev',d)} return d}catch(e){return 'dev'}})();
  const GROUPS={progress:['q','side','rt','pq'],gym:['lifts','session','doneSession','dur','phase','wu','st','startedAt'],body:['w']};
  let cfg=null, sec={}, fb=null, auth=null, db=null, user=null, status='off', err='', timer=null, unsub=[], lastM={}, lastImg={}, lastRoot='', showCfg=false;
  try{cfg=JSON.parse(localStorage.getItem(LS+'-fbcfg')||'null')}catch(e){}
  try{sec=JSON.parse(localStorage.getItem(LS+'-fbsec')||'null')||{}}catch(e){}
  SECTIONS.forEach(([id])=>{if(!(id in sec)) sec[id]=true});
  const on=id=>!!sec[id];
  const load=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s)});
  function parseCfg(txt){
    const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('Paste the firebaseConfig { ... } block');
    let j=m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
    const o=JSON.parse(j); if(!o.apiKey||!o.projectId) throw new Error('apiKey and projectId are missing'); return o;
  }
  async function start(){
    if(!cfg) return; status='loading'; err=''; rr();
    try{ await load(SDK+'firebase-app-compat.js'); await load(SDK+'firebase-auth-compat.js'); await load(SDK+'firebase-firestore-compat.js');
      fb=window.firebase; if(!fb.apps.length) fb.initializeApp(cfg); auth=fb.auth(); db=fb.firestore();
      auth.onAuthStateChanged(u=>{user=u||null; stopListen(); if(user){status='syncing'; firstSync().catch(e=>{err=e.message;status='error';rr()})} else {status='signedout'} rr()});
    }catch(e){status='error'; err=e.message; rr()}
  }
  const userRef=()=>db.collection('users').doc(user.uid);
  function dayPart(d){const o={}; for(const g in GROUPS) if(on(g)) GROUPS[g].forEach(f=>{if(d[f]!==undefined&&d[f]!==null) o[f]=d[f]}); return o}
  function monthJSON(m){const o={}; Object.keys(S.days).sort().forEach(k=>{if(k.startsWith(m)){const p=dayPart(S.days[k]); if(Object.keys(p).length) o[k]=p}}); return JSON.stringify(o)}
  function rootJSON(){const o={};
    if(on('settings')) Object.assign(o,{name:S.name,startDate:S.startDate,startWeight:S.startWeight,targetWeight:S.targetWeight,height:S.height,wk:S.wk,routine:S.routine,sound:S.sound,mode:S.mode,modeSet:S.modeSet});
    if(on('progress')) Object.assign(o,{ach:S.ach,seenLevel:S.seenLevel,seenRank:S.seenRank});
    if(on('body')) o.measurements=S.measurements; return JSON.stringify(o)}
  function applyRoot(j){const o=JSON.parse(j||'{}'); ['name','startDate','startWeight','targetWeight','height','wk','routine','sound','ach','seenLevel','seenRank','measurements','mode','modeSet'].forEach(f=>{if(o[f]!==undefined)S[f]=o[f]}); migrate()}
  function applyMonth(m,j){const o=JSON.parse(j||'{}');
    Object.keys(S.days).filter(k=>k.startsWith(m)).forEach(k=>{const d=S.days[k]; for(const g in GROUPS) if(on(g)) GROUPS[g].forEach(f=>{if(!(o[k]&&f in o[k])) delete d[f]}); d.q=d.q||{}; d.side=d.side||{}; d.lifts=d.lifts||{}});
    for(const k in o){const d=day(k); Object.assign(d,o[k]); d.q=d.q||{}; d.side=d.side||{}; d.lifts=d.lifts||{}}}
  const safeId=k=>encodeURIComponent(k).replace(/\./g,'%2E');
  function imgMap(){const o={}; if(!on('images')) return o; for(const k in CIMG) o['c|'+k]=CIMG[k]; for(const k in POSES) o['p|'+k]=JSON.stringify(POSES[k]); return o}
  const sig=s=>s.length+':'+s.slice(-48);
  async function firstSync(){
    const snap=await userRef().get(); const remote=snap.exists?snap.data():null;
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){
      applyRoot(remote.root); lastRoot=remote.root||'';
      const ms=await userRef().collection('months').get(); ms.forEach(d=>{applyMonth(d.id,d.data().json); lastM[d.id]=d.data().json});
      if(on('images')){const im=await userRef().collection('images').get(); im.forEach(d=>{const x=d.data(); applyImg(x.key,x.data); lastImg[x.key]=sig(x.data||'')}); persistImgs()}
      S.updatedAt=remote.updatedAt; saveLocal(); toastMsg('Cloud data loaded');
    } else { lastM={}; lastImg={}; lastRoot=''; await push(true) }
    listen(); status='live'; render();
  }
  function applyImg(key,data){if(key.startsWith('c|')){if(data) CIMG[key.slice(2)]=data; else delete CIMG[key.slice(2)]} else if(key.startsWith('p|')){if(data) POSES[key.slice(2)]=JSON.parse(data); else delete POSES[key.slice(2)]}}
  function persistImgs(){try{localStorage.setItem(LS+'-cardimg',JSON.stringify(CIMG)); localStorage.setItem(LS+'-poses',JSON.stringify(POSES))}catch(e){}}
  function listen(){
    unsub.push(userRef().onSnapshot(s=>{const x=s.data(); if(!x||x.device===DEV||!x.root||x.root===lastRoot) return; applyRoot(x.root); lastRoot=x.root; S.updatedAt=Math.max(S.updatedAt,x.updatedAt||0); saveLocal(); render()}));

    if(on('defaults')) unsub.push(db.collection('system').doc('images').onSnapshot(s=>{const x=s.data()||{}; REMOTE=Object.assign({},x.map||{},...Object.keys(x).filter(k=>k!=='map').map(k=>({[k]:x[k]}))); try{localStorage.setItem(LS+'-remoteimg',JSON.stringify(REMOTE))}catch(e){} render()},()=>{}));
  }

    const months=new Set(Object.keys(S.days).map(k=>k.slice(0,7)));
    months.forEach(m=>{const j=monthJSON(m); if(all||j!==lastM[m]){batch.set(userRef().collection('months').doc(m),{json:j,updatedAt:ts,device:DEV}); lastM[m]=j; n++}});
    if(n) await batch.commit();
    if(on('images')){const im=imgMap(); for(const k in im){const s=sig(im[k]); if(all||lastImg[k]!==s){await userRef().collection('images').doc(safeId(k)).set({key:k,data:im[k],updatedAt:ts,device:DEV}); lastImg[k]=s}}
      for(const k in lastImg) if(lastImg[k]&&!(k in im)){await userRef().collection('images').doc(safeId(k)).delete(); delete lastImg[k]}}
    setSave('SYNCED · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),true);
  }

  const rr=()=>{if(tab==='settings') render()};
  function view(){

     ${!cfg||showCfg?`<form id="fbForm" style="display:flex;flex-direction:column;gap:10px">
        <label class="f" for="fbCfg">Firebase config<textarea id="fbCfg" class="input" rows="7" placeholder="const firebaseConfig = {\n  apiKey: &quot;…&quot;,\n  authDomain: &quot;…&quot;,\n  projectId: &quot;…&quot;,\n  appId: &quot;…&quot;\n};">${cfg?esc(JSON.stringify(cfg,null,1)):''}</textarea></label>

        <button class="btn" type="submit">Connect project</button>${cfg?`<button type="button" class="btn ghost" data-act="fbcancel">Cancel</button>`:''}</form>`

        <form id="fbLogin" style="display:flex;flex-direction:column;gap:10px"><label class="f" for="fbE">Email<input id="fbE" type="email" class="input" autocomplete="email"></label><label class="f" for="fbP">Password<input id="fbP" type="password" class="input" autocomplete="current-password"></label>
        <div class="grid2"><button class="btn" type="submit" data-mode="in">Sign in</button><button class="btn ghost" type="submit" data-mode="up">Create account</button></div></form>
        <button class="btn ghost" style="margin-top:10px;padding:10px" data-act="fbedit">Change project / sections</button>`
     :`<div class="note">Signed in as <b style="color:var(--cream)">${esc(user.email||user.uid)}</b> · project <b style="color:var(--cream)">${esc(cfg.projectId)}</b></div>

function render(){

  document.getElementById('splashDay').textContent=`DAY ${String(dayNum(TODAY)).padStart(3,'0')} / 365`;
  topbar(); renderTabs();
  const y=scrollY;
  document.getElementById('view').innerHTML=({today:SIMPLE()?vTodaySimple:vToday,gym:vGym,body:vBody,rating:vRating,progress:vProgress,settings:vSettings,profile:SIMPLE()?vProfileSimple:vProfile}[tab]||vToday)();
  tick(); window.scrollTo(0,y);
}
function go(t){tab=t; try{localStorage.setItem(LS+'-tab',t)}catch(e){} render(); window.scrollTo({top:0})}
function tick(){
  const g=peek(gymDate);
  if(g&&g.startedAt&&!g.q.workout){const s=Math.floor((Date.now()-g.startedAt)/1000), t=Math.floor(s/60)+':'+pad(s%60); ['wkTimer','wkTimer2'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=t})}
  if(hold){const left=Math.ceil((hold.end-Date.now())/1000); const el=document.querySelector(`[data-hold="${hold.key}"] .holdleft`); if(el) el.textContent=Math.max(0,left)+'s';
    if(left<=0){const [kind,i]=hold.key.split(':'), gg=day(gymDate); gg[kind]=gg[kind]||{}; gg[kind][i]=(gg[kind][i]||0)+1; hold=null; SFX.notify(); save(); render()}}
  const rb=document.getElementById('restBar');
  if(restT){const left=Math.ceil((restT.end-Date.now())/1000); if(left<=0){restT=null; rb.hidden=true; SFX.notify(); toastMsg('Rest over · next set')} else {rb.hidden=false; rb.querySelector('.rl').textContent=Math.floor(left/60)+':'+pad(left%60); rb.querySelector('i').style.width=pct(left,restT.total)+'%'}}
  else if(rb) rb.hidden=true;
}
setInterval(tick,500);

/* routine reminders while the app is open */

function reminders(){
  const k=keyOf(new Date()), now=nowHM(); if(notified.day!==k) notified={day:k,ids:[]};

});

function exportData(){const blob=new Blob([JSON.stringify({...S,_poses:POSES,_cardimg:CIMG})],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='system-arise-backup-'+TODAY+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function importData(file){const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d||typeof d.days!=='object') throw 0;
  if(d._poses){POSES=d._poses; delete d._poses; savePoses()} if(d._cardimg){CIMG=d._cardimg; delete d._cardimg; saveCIMG()} S=Object.assign(fresh(),d); migrate(); save(); render(); toastMsg('Backup restored')}catch(err){toastMsg('That file is not a System Arise backup.')}}; r.readAsText(file)}

/* ambient neon particles */
(function(){const c=document.getElementById('fx'); if(!c||!c.getContext) return; const x=c.getContext('2d'),R=Math.min(2,devicePixelRatio||1); let W,H;
  const size=()=>{W=c.width=innerWidth*R;H=c.height=innerHeight*R}; size(); addEventListener('resize',size);
  const P=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,s:Math.random()*.0005+.00015,a:Math.random()*.5+.2,d:Math.random()*6}));
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function draw(){x.clearRect(0,0,W,H); for(const p of P){if(!still){p.y-=p.s;p.d+=.01;if(p.y<-.02){p.y=1.02;p.x=Math.random()}}
    const px=(p.x+Math.sin(p.d)*.008)*W,py=p.y*H,r=p.r*R*6,g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,`rgba(140,210,255,${p.a})`); g.addColorStop(1,'rgba(46,168,255,0)');
    x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill()} if(!still) requestAnimationFrame(draw)})();
})();

/* load images from the repo's images/ folder (missing files are simply skipped) */
function loadRepoImages(){
  let t=null; const bump=()=>{clearTimeout(t); t=setTimeout(render,250)};
  const probe=(url,ok)=>{const im=new Image(); im.onload=()=>ok(url); im.src=url};
  const keys=[...ACH.map(a=>'a:'+a[0]),...QUESTS.map(q=>'q:'+q.id),...Object.keys(SESSIONS).map(x=>'s:'+x),'s:REST',...Object.keys(EX).map(x=>'e:'+x)];
  keys.forEach(k=>probe(repoPath(k),u=>{REPO[k]=u; bump()}));
  Object.keys(EX).forEach(ex=>{const found=[]; const next=i=>{if(i>4) return; probe('images/poses/'+slug(ex)+'-'+i+'.jpg',u=>{found[i-1]=u; REPO['p:'+ex]=found.filter(Boolean); bump(); next(i+1)})}; next(1)});
}
/* boot */
saveLocal(); render(); CLOUD.start(); loadRepoImages();
setTimeout(()=>checkEvents(null),1900);
const sp=document.getElementById('splash'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hide=()=>{sp.classList.add('gone'); setTimeout(()=>sp.hidden=true,500)};
sp.addEventListener('click',()=>{SFX.boot();hide()});
setTimeout(hide,reduce?200:1800);
})();
